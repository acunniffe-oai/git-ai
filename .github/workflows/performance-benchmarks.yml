name: Session Linking Performance

permissions:
  contents: read

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.toml', 'Cargo.lock', 'Taskfile.yml', '.github/workflows/performance-benchmarks.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  linking-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.93.0'
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - name: Verify bounded Git process count and checkpoint fast paths
        run: task test TEST_FILTER=v2_ CARGO_TEST_ARGS='--test integration'
